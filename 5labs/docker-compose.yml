services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
      POSTGRES_DB: loyalty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: loyalty
      RABBITMQ_DEFAULT_PASS: loyalty
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_listener 5672"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql+asyncpg://loyalty:loyalty@postgres:5432/loyalty
      RABBITMQ_URL: amqp://loyalty:loyalty@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://loyalty:loyalty@postgres:5432/loyalty
      RABBITMQ_URL: amqp://loyalty:loyalty@rabbitmq:5672/
    depends_on:
      worker:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    build: ./notifier
    ports:
      - "8001:8001"
    environment:
      RABBITMQ_URL: amqp://loyalty:loyalty@rabbitmq:5672/
      MIN_DELAY_MS: 200
      MAX_DELAY_MS: 1500
      UNSUBSCRIBED: ""
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build: ./analytics
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://loyalty:loyalty@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
