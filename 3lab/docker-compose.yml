
services:
  app:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: "5000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
