
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supplier1:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn supplier.app:app --host 0.0.0.0 --port 8000
    environment:
      SUPPLIER_NAME: supplier1
    ports:
      - "8001:8000"
    restart: unless-stopped

  supplier2:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn supplier.app:app --host 0.0.0.0 --port 8000
    environment:
      SUPPLIER_NAME: supplier2
    ports:
      - "8002:8000"
    restart: unless-stopped

  supplier3:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn supplier.app:app --host 0.0.0.0 --port 8000
    environment:
      SUPPLIER_NAME: supplier3
    ports:
      - "8003:8000"
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn search_service.app:app --host 0.0.0.0 --port 8000
    cap_add:
      - SYS_PTRACE
    environment:
      DATABASE_URL: postgresql+asyncpg://library:library@host.docker.internal:5432/library
      SUPPLIER_1_URL: http://host.docker.internal:8001
      SUPPLIER_2_URL: http://host.docker.internal:8002
      SUPPLIER_3_URL: http://host.docker.internal:8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      supplier1:
        condition: service_started
      supplier2:
        condition: service_started
      supplier3:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: python generator.py
    environment:
      DATABASE_URL: postgresql+asyncpg://library:library@host.docker.internal:5432/library
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
